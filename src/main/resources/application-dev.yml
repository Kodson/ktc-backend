# Development Environment Configuration
spring:
  profiles:
    active: dev

  # PostgreSQL Development Database
  datasource:
    url: jdbc:postgresql://localhost:5432/kodsonplus_dev
    username: kodsonuser
    password: kodsonpass

  jpa:
    hibernate:
      ddl-auto: create-drop  # Auto-create tables for development
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Development
  data:
    redis:
      host: localhost
      port: 6379
      database: 1  # Use different database for dev

# Logging for development
logging:
  level:
    com.kodsonApp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG

# Development server settings
server:
  tomcat:
    threads:
      max: 50  # Lower for development

