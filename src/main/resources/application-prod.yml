# Production on Ubuntu: PostgreSQL on host OS; docker compose/run with network_mode: host.
# Defaults below apply when SPRING_DATASOURCE_* env vars are unset (Spring Boot relaxed binding).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ktc_postgress}
    username: ${SPRING_DATASOURCE_USERNAME:ktc_kodson_user}
    password: "${SPRING_DATASOURCE_PASSWORD:0040105715@Kodson12345}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

logging:
  level:
    com.kodsonApp: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    name: logs/kodson-api.log
    max-size: 100MB
    max-history: 30

server:
  ssl:
    enabled: false
