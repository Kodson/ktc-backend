# Production on Ubuntu: PostgreSQL on the host, backend in Docker (host.docker.internal).
spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ktc_postgress}"
    username: "${SPRING_DATASOURCE_USERNAME:ktc_kodson_user}"
    password: "${SPRING_DATASOURCE_PASSWORD:0040105715@Kodson12345}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

logging:
  level:
    com.kodsonApp: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    name: logs/kodson-api.log
    max-size: 100MB
    max-history: 30

server:
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
