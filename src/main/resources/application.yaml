spring:

  datasource:
    url: jdbc:postgresql://dpg-d81fp83rjlhs73b4jk0g-a/ktc_kdvl
    username: ktc_kodson_user
    password: yCcvufpZ0JIVVtsaWQ7xfwOKT4voRaBJ
    driver-class-name: org.postgresql.Driver
    # HikariCP connection pooling for performance
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: HikariPool-KodsonApi

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # Changed from 'create' to 'update' to preserve existing data
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        # Simplified performance optimizations without JCache
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false
        # Removed cache configuration that was causing issues

  # Completely disable Redis data repositories
  data:
    redis:
      repositories:
        enabled: false

  cache:
    type: simple  # Use simple cache instead of Redis for now

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB  # Reduced from 1000MB for better performance
      max-request-size: 100MB

  # Jackson configuration for better JSON performance
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

