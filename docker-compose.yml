# Ubuntu: PostgreSQL on host (listens on 127.0.0.1). Backend uses host network so 127.0.0.1:5432 works.
services:
  backend:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/ktc_postgress
