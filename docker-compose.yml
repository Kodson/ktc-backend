# Ubuntu server: backend in Docker, PostgreSQL installed on the host OS.
services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/ktc_postgress
    extra_hosts:
      - "host.docker.internal:host-gateway"
