services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ktc_postgress
      POSTGRES_USER: ktc_kodson_user
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-0040105715@Kodson12345}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktc_kodson_user -d ktc_postgress"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ktc_postgress
    depends_on:
      postgres:
        condition: service_healthy
