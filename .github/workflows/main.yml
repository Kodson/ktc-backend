name: Build and Push Backend to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ktc_postgress
          POSTGRES_USER: ktc_kodson_user
          POSTGRES_PASSWORD: 0040105715@Kodson12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ktc_kodson_user -d ktc_postgress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Wait for PostgreSQL to be ready
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U ktc_kodson_user -d ktc_postgress; then
              echo "PostgreSQL is up!"
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Build with Maven (skip tests)
        run: mvn clean package -DskipTests

      - name: List target directory contents
        run: ls -al target

      - name: Verify JAR file exists
        run: |
          if [ ! -f target/ktc-backend.jar ]; then
            echo "JAR file not found!"
            exit 1
          fi

      - name: Log in to Docker Hub
        run: echo "${{ secrets.KODSON_DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.KODSON_DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t kodson/ktc-backend:latest .

      - name: Push Docker image to Docker Hub
        run: docker push kodson/ktc-backend:latest
