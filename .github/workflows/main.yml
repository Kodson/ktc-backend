name: Build and Push Backend to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 0040105715@Kodson12345
          MYSQL_DATABASE: kodsonplus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root --password=0040105715@Kodson12345; then
              echo "MySQL is up!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Build with Maven (skip tests)
        run: mvn clean package -DskipTests

      - name: List target directory contents
        run: ls -al target

      - name: Verify JAR file exists
        run: |
          if [ ! -f target/KodsonApi.jar ]; then
            echo "JAR file not found!"
            exit 1
          fi

      - name: Log in to Docker Hub
        run: echo "${{ secrets.KODSON_DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.KODSON_DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t kodson/backend:latest .

      - name: Push Docker image to Docker Hub
        run: docker push kodson/backend:latest
